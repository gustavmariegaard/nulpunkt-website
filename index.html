<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --grey: #8f8f93;
    --line: #dcdcdf;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .page {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(16px, 2vw, 24px);
    gap: clamp(24px, 4vw, 48px);
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .top, .bottom, main { position: relative; z-index: 1; }
  .top, .bottom { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; }
  #coord { font-variant-numeric: tabular-nums; }
  main { align-self: center; }

  .slot {
    width: min(100%, 760px);
    aspect-ratio: 516 / 112;
    margin: 0 0 clamp(44px, 7vw, 96px);
    color: var(--fg);
    touch-action: pan-y;
  }
  .slot svg { display: block; width: 100%; height: 100%; }
  .js .slot svg { visibility: hidden; }
  .js .slot.rest svg { visibility: visible; }

  /* one large, quiet sentence; the email is the only black type */
  .statement {
    margin: 0;
    max-width: 14em;
    font-size: clamp(28px, 4.6vw, 64px);
    line-height: 1.04;
    letter-spacing: -0.035em;
    color: var(--grey);
  }
  .statement span, .statement > a { display: block; white-space: nowrap; }
  .statement > a { color: var(--fg); text-decoration: none; padding-bottom: 12px; margin-bottom: -12px; }
  .statement span a { color: inherit; text-decoration: none; padding: 10px 0 0; }
  .statement span a:hover { color: var(--fg); }
  .statement a:hover { text-decoration: underline; text-decoration-thickness: 0.06em; text-underline-offset: 0.12em; }

  .bio {
    margin: clamp(22px, 3vw, 36px) 0 0;
    max-width: 34em;
    font-size: clamp(15px, 1.35vw, 18px);
    line-height: 1.45;
    letter-spacing: -0.01em;
    color: var(--grey);
  }
  .links { margin: 14px 0 0; font-size: clamp(15px, 1.35vw, 18px); letter-spacing: -0.01em; color: var(--grey); }
  .links a { display: inline-block; padding: 12px 12px 12px 0; margin: -12px -12px -12px 0; text-decoration: underline; text-decoration-color: currentColor; text-underline-offset: 0.18em; text-decoration-thickness: 0.06em; }
  .links a:hover { color: var(--fg); }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: rgba(255, 77, 0, 0.18); }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  @media (max-width: 720px) {
    .statement { font-size: 5.9vw; }
  }
</style>
</head>
<body>
<div class="page">
  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="top">
    <span id="coord" aria-hidden="true">(0, 0)</span>
  </header>

  <main>
    <h1 class="sr-only">Nulpunkt</h1>
    <div class="slot" id="slot">
      <svg role="img" aria-label="nulpunkt" viewBox="31 24 516 112" fill="currentColor"><path d="M 360 42 L 359 43 L 359 116 L 360 117 L 378 117 L 378 62 L 379 61 L 405 61 L 406 62 L 406 117 L 425 117 L 425 52 L 416 52 L 415 51 L 415 42 L 388 42 L 388 51 L 387 52 L 379 52 L 378 51 L 378 43 L 377 42 Z"/><path d="M 285 42 L 284 43 L 284 107 L 285 108 L 293 108 L 294 109 L 294 117 L 321 117 L 321 109 L 322 108 L 330 108 L 331 109 L 331 117 L 350 117 L 350 43 L 349 42 L 332 42 L 331 43 L 331 98 L 330 99 L 304 99 L 303 98 L 303 43 L 302 42 Z"/><path d="M 210 42 L 209 43 L 209 136 L 227 136 L 228 135 L 228 118 L 229 117 L 265 117 L 265 109 L 266 108 L 274 108 L 275 107 L 275 53 L 274 52 L 266 52 L 265 51 L 265 42 L 238 42 L 237 43 L 237 51 L 236 52 L 229 52 L 228 51 L 228 43 L 227 42 Z M 228 62 L 229 61 L 255 61 L 256 62 L 256 98 L 255 99 L 229 99 L 228 98 Z"/><path d="M 106 42 L 106 108 L 114 108 L 115 109 L 115 117 L 143 117 L 143 109 L 144 108 L 152 108 L 153 109 L 153 117 L 171 117 L 171 42 L 153 42 L 153 98 L 152 99 L 125 99 L 124 98 L 124 42 Z"/><path d="M 31 42 L 31 117 L 49 117 L 49 62 L 50 61 L 77 61 L 78 62 L 78 117 L 96 117 L 96 52 L 88 52 L 87 51 L 87 43 L 86 42 L 60 42 L 59 43 L 59 51 L 58 52 L 50 52 L 49 51 L 49 42 Z"/><path d="M 519 24 L 519 32 L 518 33 L 510 33 L 510 51 L 509 52 L 500 52 L 500 70 L 509 70 L 510 71 L 510 108 L 518 108 L 519 109 L 519 117 L 547 117 L 547 99 L 529 99 L 528 98 L 528 71 L 529 70 L 547 70 L 547 52 L 529 52 L 528 51 L 528 24 Z"/><path d="M 435 24 L 435 117 L 453 117 L 453 81 L 454 80 L 462 80 L 463 81 L 463 89 L 471 89 L 472 90 L 472 117 L 490 117 L 490 89 L 482 89 L 481 88 L 481 80 L 473 80 L 472 79 L 472 71 L 473 70 L 481 70 L 481 62 L 482 61 L 490 61 L 490 42 L 473 42 L 472 43 L 472 60 L 471 61 L 463 61 L 463 70 L 462 71 L 454 71 L 453 70 L 453 24 Z"/><path d="M 181 24 L 181 117 L 199 117 L 199 24 Z"/></svg>

<script>
/* The logo is drawn as ~3,000 pixels that fly out from (0, 0), settle into the
   wordmark and scatter away from the pointer or a finger. At rest the real SVG
   takes over. Falls back to the plain SVG if anything fails, and stays still
   when reduced motion is requested. */
(function () {
  var root = document.documentElement;
  try {
    var D = ["M 360 42 L 359 43 L 359 116 L 360 117 L 378 117 L 378 62 L 379 61 L 405 61 L 406 62 L 406 117 L 425 117 L 425 52 L 416 52 L 415 51 L 415 42 L 388 42 L 388 51 L 387 52 L 379 52 L 378 51 L 378 43 L 377 42 Z", "M 285 42 L 284 43 L 284 107 L 285 108 L 293 108 L 294 109 L 294 117 L 321 117 L 321 109 L 322 108 L 330 108 L 331 109 L 331 117 L 350 117 L 350 43 L 349 42 L 332 42 L 331 43 L 331 98 L 330 99 L 304 99 L 303 98 L 303 43 L 302 42 Z", "M 210 42 L 209 43 L 209 136 L 227 136 L 228 135 L 228 118 L 229 117 L 265 117 L 265 109 L 266 108 L 274 108 L 275 107 L 275 53 L 274 52 L 266 52 L 265 51 L 265 42 L 238 42 L 237 43 L 237 51 L 236 52 L 229 52 L 228 51 L 228 43 L 227 42 Z M 228 62 L 229 61 L 255 61 L 256 62 L 256 98 L 255 99 L 229 99 L 228 98 Z", "M 106 42 L 106 108 L 114 108 L 115 109 L 115 117 L 143 117 L 143 109 L 144 108 L 152 108 L 153 109 L 153 117 L 171 117 L 171 42 L 153 42 L 153 98 L 152 99 L 125 99 L 124 98 L 124 42 Z", "M 31 42 L 31 117 L 49 117 L 49 62 L 50 61 L 77 61 L 78 62 L 78 117 L 96 117 L 96 52 L 88 52 L 87 51 L 87 43 L 86 42 L 60 42 L 59 43 L 59 51 L 58 52 L 50 52 L 49 51 L 49 42 Z", "M 519 24 L 519 32 L 518 33 L 510 33 L 510 51 L 509 52 L 500 52 L 500 70 L 509 70 L 510 71 L 510 108 L 518 108 L 519 109 L 519 117 L 547 117 L 547 99 L 529 99 L 528 98 L 528 71 L 529 70 L 547 70 L 547 52 L 529 52 L 528 51 L 528 24 Z", "M 435 24 L 435 117 L 453 117 L 453 81 L 454 80 L 462 80 L 463 81 L 463 89 L 471 89 L 472 90 L 472 117 L 490 117 L 490 89 L 482 89 L 481 88 L 481 80 L 473 80 L 472 79 L 472 71 L 473 70 L 481 70 L 481 62 L 482 61 L 490 61 L 490 42 L 473 42 L 472 43 L 472 60 L 471 61 L 463 61 L 463 70 L 462 71 L 454 71 L 453 70 L 453 24 Z", "M 181 24 L 181 117 L 199 117 L 199 24 Z"];
    var UNIT = 3, COLS = 172, ROWS = 38;
    var slot = document.getElementById('slot');
    var canvas = document.getElementById('fx');
    var coord = document.getElementById('coord');
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 1. Sample the wordmark into a grid of pixels
    var off = document.createElement('canvas');
    off.width = COLS; off.height = ROWS;
    var octx = off.getContext('2d', { willReadFrequently: true });
    octx.scale(1 / UNIT, 1 / UNIT);
    octx.translate(-31, -24);
    D.forEach(function (d) { octx.fill(new Path2D(d)); });
    var img = octx.getImageData(0, 0, COLS, ROWS).data;
    var P = [];
    for (var gy = 0; gy < ROWS; gy++) {
      for (var gx = 0; gx < COLS; gx++) {
        if (img[(gy * COLS + gx) * 4 + 3] > 110) {
          P.push({ gx: gx, gy: gy, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, delay: 0 });
        }
      }
    }

    var dpr = 1, W = 0, H = 0, cell = 1, R = 90, PUSH = 40;
    var box = { x0: 0, y0: 0, x1: 0, y1: 0 };
    var pointer = null, running = false, t0 = 0, last = 0, lastMove = 0;
    var K = 0.075, DAMP = 0.8;
    var ACC = [255, 77, 0], LV = 10, PAL = [], DT = 30;   // orange while a pixel is away from its place

    function palette() {
      var m = getComputedStyle(document.body).color.match(/[\d.]+/g) || [17, 17, 17];
      var fg = [+m[0], +m[1], +m[2]];
      PAL = [];
      for (var i = 0; i <= LV; i++) {
        var t = i / LV;
        PAL.push('rgb(' + Math.round(fg[0] + (ACC[0] - fg[0]) * t) + ',' +
                          Math.round(fg[1] + (ACC[1] - fg[1]) * t) + ',' +
                          Math.round(fg[2] + (ACC[2] - fg[2]) * t) + ')');
      }
    }

    function layout(intro) {
      var pr = canvas.parentElement.getBoundingClientRect();
      var sr = slot.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = pr.width; H = pr.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      var ox = sr.left - pr.left, oy = sr.top - pr.top;
      cell = sr.width / COLS;
      box = { x0: ox, y0: oy, x1: ox + sr.width, y1: oy + sr.height };
      R = Math.min(130, Math.max(60, sr.width * 0.14));
      PUSH = R * 0.45;
      DT = Math.max(24, R * 0.4);
      palette();
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        p.tx = ox + p.gx * cell;
        p.ty = oy + p.gy * cell;
        if (intro) {
          p.x = (Math.random() - 0.5) * 6; p.y = (Math.random() - 0.5) * 6;
          p.vx = 0; p.vy = 0;
          p.delay = (p.gx / COLS) * 750 + Math.random() * 260;
        } else {
          p.x = p.tx; p.y = p.ty; p.vx = 0; p.vy = 0; p.delay = 0;
        }
      }
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      var s = Math.ceil(cell * dpr) / dpr, i, p, l;
      for (i = 0; i < P.length; i++) {
        p = P[i];
        var d = Math.sqrt((p.x - p.tx) * (p.x - p.tx) + (p.y - p.ty) * (p.y - p.ty));
        p.lv = Math.min(LV, Math.round(Math.pow(Math.min(1, d / DT), 0.6) * LV));
      }
      for (l = 0; l <= LV; l++) {
        ctx.fillStyle = PAL[l];
        for (i = 0; i < P.length; i++) {
          p = P[i];
          if (p.lv === l) ctx.fillRect(Math.round(p.x * dpr) / dpr, Math.round(p.y * dpr) / dpr, s, s);
        }
      }
    }

    function step(now) {
      var dt = Math.min((now - last) / 16.67, 2.5); last = now;
      var t = now - t0, active = false, R2 = R * R;
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        if (t < p.delay) { active = true; continue; }
        var ax = (p.tx - p.x) * K, ay = (p.ty - p.y) * K;
        if (pointer) {
          var dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy;
          if (d2 < R2) {
            var d = Math.sqrt(d2) || 1, f = Math.pow(1 - d / R, 2) * PUSH;
            ax += dx / d * f; ay += dy / d * f;
          }
        }
        var damp = Math.pow(DAMP, dt);
        p.vx = (p.vx + ax * dt) * damp; p.vy = (p.vy + ay * dt) * damp;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (Math.abs(p.tx - p.x) > 0.05 || Math.abs(p.ty - p.y) > 0.05 ||
            Math.abs(p.vx) > 0.05 || Math.abs(p.vy) > 0.05) active = true;
      }
      draw();
      if (active || pointer || now - lastMove < 1200) { requestAnimationFrame(step); }
      else {
        running = false;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
        slot.classList.add('rest');
      }
    }

    function start() {
      if (running) return;
      running = true; last = performance.now();
      slot.classList.remove('rest');
      requestAnimationFrame(step);
    }

    function aim(e) {
      coord.textContent = '(' + Math.round(e.pageX) + ', ' + Math.round(e.pageY) + ')';
      var near = e.pageX > box.x0 - R && e.pageX < box.x1 + R &&
                 e.pageY > box.y0 - R && e.pageY < box.y1 + R;
      if (near) {
        pointer = { x: e.pageX, y: e.pageY };
        lastMove = performance.now();
        start();
      } else {
        pointer = null;
      }
    }
    function release(e) {
      if (e.pointerType && e.pointerType !== 'mouse') { pointer = null; lastMove = performance.now(); }
    }

    layout(!reduce);
    root.classList.add('live');
    if (reduce) {
      slot.classList.add('rest');
    } else {
      t0 = performance.now();
      start();
      window.addEventListener('pointermove', aim, { passive: true });
      window.addEventListener('pointerdown', aim, { passive: true });
      window.addEventListener('pointerup', release, { passive: true });
      window.addEventListener('pointercancel', release, { passive: true });
      document.documentElement.addEventListener('mouseleave', function () { pointer = null; });
      window.addEventListener('blur', function () { pointer = null; });
    }

    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { layout(false); if (running) draw(); }, 150);
    });
  } catch (err) {
    root.classList.remove('js');   // show the plain SVG logo instead
    if (window.console) console.error(err);
  }
})();
</script>
</body>
</html>
